spring.config.import=optional:file:.env[.properties]
 
spring.datasource.url=${DB_URL:jdbc:h2:mem:simulador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
app.mail.from=${MAIL_FROM}
app.mail.recovery.password.url=${RECOVERY_PASS_URL}
 
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
 
app.exchange.mxn-usd=${EXCHANGE_MXN_USD:0.055000}
app.exchange.usd-mxn=${EXCHANGE_USD_MXN:18.000000}
 
app.alphavantage.base-url=${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co/query}
app.alphavantage.api-key=${ALPHA_VANTAGE_API_KEY}

app.batch.symbols=${BATCH_SYMBOLS:AAPL,MSFT,GOOGL}
app.batch.scheduler.cron=${BATCH_SCHEDULER_CRON:0 0 2 * * *}
app.batch.scheduler.zone=${BATCH_SCHEDULER_ZONE:UTC}
app.batch.scheduler.enabled=${BATCH_SCHEDULER_ENABLED:true}
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false