spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
 
spring.datasource.url=${DB_URL:jdbc:h2:mem:simulador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
 
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
 
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:noreply@localhost}
app.mail.recovery.password.url=${RECOVERY_PASS_URL:http://localhost:8080/reset-password}
 
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
 
app.exchange.mxn-usd=${EXCHANGE_MXN_USD:0.055000}
app.exchange.usd-mxn=${EXCHANGE_USD_MXN:18.000000}
app.exchange.api-base-url=${EXCHANGE_API_BASE_URL:https://api.frankfurter.dev}
 
app.alphavantage.base-url=${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co/query}
app.alphavantage.api-key=${ALPHA_VANTAGE_API_KEY}

app.http.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:5}
app.http.read-timeout-seconds=${HTTP_READ_TIMEOUT_SECONDS:10}

app.batch.symbols=${BATCH_SYMBOLS:AAPL,TSLA,MSFT,AMZN,WMT}
app.batch.scheduler.cron=${BATCH_SCHEDULER_CRON:0 0 2 * * *}
app.batch.scheduler.zone=${BATCH_SCHEDULER_ZONE:UTC}
app.batch.scheduler.enabled=${BATCH_SCHEDULER_ENABLED:true}
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Demo data seed (users, accounts, stocks, position, history). Off by default.
app.seed.enabled=${SEED_DEMO_DATA:false}
