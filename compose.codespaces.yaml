services:
  app:
    build: .
    container_name: nova_bank_backend
    # GitHub Codespaces: Compose's private bridge network cannot resolve external
    # DNS (Docker's embedded resolver can't reach Azure's DNS, and egress to public
    # resolvers is blocked by the Codespaces firewall), so Maven fails to download
    # dependencies. Sharing the host network stack gives the container the working
    # DNS the Codespace VM uses.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # With network_mode: host there is no Compose service DNS, so reach Postgres
      # through its port published on the host, not the "postgres" service name.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${DB_PORT:-5432}/${DB_NAME:-nova_bank}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Local Mailpit, reached through its port published on the host.
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      # Loads idempotent demo users/accounts/stocks when true (see .env.example).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - .:/app
      - maven_repo:/root/.m2

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-nova_bank}
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: mailpit
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  maven_repo:
